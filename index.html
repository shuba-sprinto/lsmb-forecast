async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function unlock(){const pw=document.getElementById('pw').value;const h=await sha256(pw);if(h===HASH){const html=atob(DATA);document.open();document.write(html);document.close();}else{const e=document.getElementById('err');e.style.display='block';document.getElementById('pw').value='';document.getElementById('pw').focus();}}
</script>
